<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-AI CONET INC — New York</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#04080F;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;color:#fff;}
  .wrap{text-align:center;animation:fadeIn 0.6s ease;}
  .logo{font-size:13px;letter-spacing:4px;color:rgba(100,180,255,0.6);text-transform:uppercase;margin-bottom:16px;}
  .spinner{width:36px;height:36px;border:2px solid rgba(0,200,255,0.15);border-top-color:rgba(0,200,255,0.7);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
  .msg{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,0.35);text-transform:uppercase;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">K-AI CONET · NEW YORK</div>
  <div class="spinner"></div>
  <div class="msg">Loading...</div>
</div>
<script>
(function(){
  var lang=(navigator.language||navigator.userLanguage||'en').toLowerCase();
  var prefix=lang.split('-')[0];
  var map={
    'ko':'https://k-aiconet.com/index_kr.html',
    'ar':'https://k-aiconet.com/index_ar.html',
    'es':'https://k-aiconet.com/index_es.html',
    'hi':'https://k-aiconet.com/index_hi.html',
    'ja':'https://k-aiconet.com/index_ja.html',
    'zh':'https://k-aiconet.com/index_zh.html'
  };
  var target=map[prefix]||'https://k-aiconet.com/index_en.html';
  setTimeout(function(){window.location.replace(target);},400);
})();
</script>
</body>
</html>
