<!--
  USAI Wallet 파비콘 마스터 (16~48px 용)

  아이콘 마스터를 그대로 줄이면 링(22/512 ≈ 4%)이 16px 에서 0.7px 가 되어 사라진다.
  작은 크기 전용으로 획을 굵히고 여백을 줄인 별도 원본을 둔다(광학 사이징).
    · 링 굵기 22 → 40, 반지름 168 → 176
    · 모노그램 획 36 → 62
    · 배경 라운드 114 → 96 (작을수록 라운드가 과해 보인다)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5BFF"/>
      <stop offset="1" stop-color="#071A4A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00A8E8"/>
      <stop offset="1" stop-color="#4FE3FF"/>
    </linearGradient>
    <linearGradient id="gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#D99A17"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <g fill="none" stroke-linecap="round" stroke-width="40">
    <path d="M 111.9 155.1 A 176 176 0 0 1 400.1 356.9" stroke="url(#cyan)"/>
    <path d="M 380.5 380.5 A 176 176 0 0 1 96.1 181.2" stroke="url(#gold)"/>
  </g>

  <path d="M 190 178 V 278 A 66 66 0 0 0 322 278 V 178"
        fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/>
</svg>
